name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The window's accessibility tests query Slint's element tree, which needs debug info in
  # the generated code. Without it they skip.
  SLINT_EMIT_DEBUG_INFO: 1

jobs:
  linux:
    name: check and test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo lint
      - name: Test
        run: cargo test --workspace --locked

  macos:
    name: test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked

  # The Windows integration is tested on the other systems through stand-ins. This job
  # builds it for real; its tests have not passed on Windows yet, so they may fail without
  # failing the run.
  windows:
    name: build (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        continue-on-error: true
        run: cargo test --workspace --locked
