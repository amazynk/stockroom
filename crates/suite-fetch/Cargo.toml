[package]
name = "suite-fetch"
description = "Resumable HTTPS downloads with progress, SHA-256 while writing, size checks and retries"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
suite-catalog.workspace = true
suite-identity.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ureq = { workspace = true, features = ["rustls", "platform-verifier"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { workspace = true, features = ["native-tls-no-default", "win-system-proxy"] }

[dev-dependencies]
suite-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
