[package]
name = "suite-ui"
description = "Stockroom's app window (Slint): apps, app pages, activity, settings, and the compact install window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
suite-catalog.workspace = true
suite-core.workspace = true
suite-detect.workspace = true
suite-identity.workspace = true
suite-install.workspace = true
suite-platform.workspace = true
suite-ui-markup.workspace = true
# Local time for the log of past changes; already in the tree through Slint.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
interprocess.workspace = true
png.workspace = true
qrcode.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
slint.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

[features]
default = ["gpu"]
# The femtovg renderer on wgpu, with the software renderer as fallback. Without it the
# window always draws in software, and wgpu, naga and femtovg are left out of the binary.
gpu = ["slint/renderer-femtovg-wgpu", "slint/unstable-wgpu-30"]

[dev-dependencies]
i-slint-backend-testing.workspace = true
suite-fetch.workspace = true
suite-testkit.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
